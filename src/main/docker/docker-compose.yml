services:
  quarkus:
    image: maven:3-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ../../../:/workspace
      - ~/.m2:/root/.m2
    ports:
      - "8080:8080"
      - "5005:5005"
    command:
      - mvn
      - quarkus:dev
      - -Dquarkus.http.host=0.0.0.0
      - -Ddebug=5005